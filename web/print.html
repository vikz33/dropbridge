<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Meja DropBridge</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: #f1f6f5; color: #0b3d38; display: grid; place-items: center; min-height: 100vh; }
  .sheet { background: #fff; width: min(92vw, 520px); padding: 36px; border-radius: 24px; text-align: center; box-shadow: 0 6px 30px rgba(11,61,56,.12); }
  h1 { margin: 0 0 4px; font-size: 32px; color: #0f766e; }
  p { margin: 6px 0; }
  img { width: 100%; max-width: 360px; height: auto; margin: 18px auto; display: block; }
  .addr { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
  .steps { text-align: left; display: inline-block; margin-top: 12px; font-size: 16px; line-height: 1.6; }
  .muted { color: #5b6f6c; font-size: 14px; }
  button { margin-top: 18px; font: inherit; font-weight: 700; padding: 12px 24px; border: 0; border-radius: 14px; background: #0f766e; color: #fff; cursor: pointer; }
  @media print { body { background: #fff; } .sheet { box-shadow: none; } .noprint { display: none; } }
</style>
</head>
<body>
<main class="sheet">
  <h1>DropBridge</h1>
  <p>Kirim dan ambil file lewat Wi-Fi kantor</p>
  <img id="qr" alt="Kode QR DropBridge">
  <p class="addr" id="addr"></p>
  <ol class="steps">
    <li>Sambungkan HP ke Wi-Fi yang sama dengan PC.</li>
    <li>Scan kode QR ini dengan kamera HP.</li>
    <li>Masukkan PIN dari petugas, lalu pilih file.</li>
  </ol>
  <p class="muted" id="note"></p>
  <button class="noprint" onclick="window.print()">Cetak</button>
</main>
<script src="print.js"></script>
</body>
</html>
