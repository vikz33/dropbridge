<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropBridge</title>
<style>
:root{color-scheme:light dark;--bg:#f1f6f5;--card:#fff;--text:#0b1f1c;--muted:#4b635f;--line:#d5e2df;--accent:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0a1a18;--card:#10272a;--text:#e6f2f0;--muted:#9db8b3;--line:#1d3a36;--accent:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-size:1.4rem;font-weight:800;margin:4px 0 12px;color:var(--text)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}.m{color:var(--muted);font-size:.9rem}
button,.b{display:inline-block;font:inherit;font-weight:600;min-height:48px;padding:0 20px;border-radius:16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;line-height:46px;font-weight:700}
input[type=text],input[type=tel]{font:inherit;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px;font-size:1.3rem;letter-spacing:.3em;text-align:center}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.e{color:#b91c1c}.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1>DropBridge</h1>

<div id="login" class="c hide">
  <h2>Masukkan kode</h2>
  <p class="m">Kode 6 angka yang tampil di layar HP yang jadi host.</p>
  <input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
  <button id="go" type="button">Masuk</button>
  <p id="lerr" class="e"></p>
</div>

<div id="app" class="hide">
  <div class="c">
    <h2>Kirim ke HP ini</h2>
    <p class="m">Pilih foto atau file dari perangkatmu. Tersimpan di folder Download/DropBridge di HP host.</p>
    <button id="pick" type="button">Pilih file</button>
    <input id="picker" type="file" multiple class="hide">
    <div id="ups" style="margin-top:10px"></div>
  </div>
  <div class="c">
    <h2>Ambil dari HP ini</h2>
    <div id="acts" class="hide" style="margin-bottom:10px">
      <button id="all" type="button">Unduh semua</button>
      <a id="zip" class="b" href="#">ZIP</a>
      <button id="share" type="button" class="hide">Simpan ke Foto / Bagikan</button>
      <label class="m" style="display:block;margin-top:10px"><input id="auto" type="checkbox"> Simpan otomatis file baru yang dibagikan</label>
      <p class="m" id="autonote"></p>
    </div>
    <div id="list"><p class="m">Belum ada file yang dibagikan.</p></div>
  </div>
</div>
</div>
<script>
(function(){
var K='';
try{K=new URLSearchParams(location.search).get('k')||sessionStorage.getItem('k')||'';}catch(e){}
function $(i){return document.getElementById(i);}
function fmt(b){if(b<1024)return b+' B';var u=['KB','MB','GB'],i=-1;do{b/=1024;i++;}while(b>=1024&&i<2);return b.toFixed(b>=100?0:1)+' '+u[i];}
function check(k,cb){
  var x=new XMLHttpRequest();x.open('GET','/api/ping?k='+encodeURIComponent(k));
  x.onload=function(){cb(x.status===200,x.status);};x.onerror=function(){cb(false,0);};x.send();
}
function enter(k){
  K=k;try{sessionStorage.setItem('k',k);}catch(e){}
  $('login').className='c hide';$('app').className='';
  refresh();setInterval(refresh,4000);
}
function start(){
  if(K){check(K,function(ok){if(ok)enter(K);else{$('login').className='c';}});}
  else{$('login').className='c';}
}
$('go').onclick=function(){
  var k=$('code').value.trim();
  check(k,function(ok,st){
    if(ok)enter(k);else $('lerr').textContent=st===429?'Terlalu banyak percobaan. Tunggu semenit.':(st===0?'Tidak bisa terhubung.':'Kode salah.');
  });
};
var cur=[],seen={},autoQ=[],autoBusy=false;
function dlUrl(f){return '/dl/'+f.id+'?k='+encodeURIComponent(K);}
function trigger(f){
  var a=document.createElement('a');a.href=dlUrl(f);a.setAttribute('download',f.name);
  a.style.display='none';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function seq(list){
  var i=0;(function next(){if(i>=list.length)return;trigger(list[i]);i++;setTimeout(next,800);})();
}
function key(f){return f.id+'|'+f.name;}
function autoRun(){
  if(autoBusy)return;autoBusy=true;
  (function next(){
    var f=autoQ.shift();
    if(!f){autoBusy=false;return;}
    trigger(f);setTimeout(next,800);
  })();
}
function refresh(){
  var x=new XMLHttpRequest();x.open('GET','/api/list?k='+encodeURIComponent(K));
  x.onload=function(){
    if(x.status!==200)return;
    var f=JSON.parse(x.responseText).files,box=$('list');
    cur=f;
    $('acts').className=f.length?'':'hide';
    $('zip').href='/dlzip?k='+encodeURIComponent(K);
    if($('auto').checked){
      f.forEach(function(it){if(!seen[key(it)]){seen[key(it)]=1;autoQ.push(it);}});
      if(autoQ.length)autoRun();
    }
    if(!f.length){box.innerHTML='<p class="m">Belum ada file yang dibagikan.</p>';return;}
    box.innerHTML='';
    f.forEach(function(it){
      var r=document.createElement('div');r.className='row';
      var n=document.createElement('div');n.className='n';n.textContent=it.name;
      var a=document.createElement('a');a.className='b';a.textContent='Unduh';
      a.href=dlUrl(it);a.setAttribute('download',it.name);
      var s=document.createElement('div');s.className='m';s.textContent=fmt(it.size);
      r.appendChild(n);r.appendChild(a);r.appendChild(s);box.appendChild(r);
    });
  };
  x.send();
}
$('all').onclick=function(){seq(cur.slice());};
$('auto').onchange=function(){
  if($('auto').checked){
    cur.forEach(function(it){seen[key(it)]=1;}); // hanya file yang dibagikan SETELAH ini
    $('autonote').textContent='Aktif. Biarkan halaman ini terbuka. Jika browser bertanya "izinkan unduhan", pilih Izinkan.';
  }else{$('autonote').textContent='';}
};
if(navigator.canShare&&navigator.share){$('share').className='';}
$('share').onclick=function(){
  var btn=$('share');btn.disabled=true;btn.textContent='Menyiapkan...';
  Promise.all(cur.map(function(f){
    return fetch(dlUrl(f)).then(function(r){return r.blob();}).then(function(b){
      var ext=f.name.split('.').pop().toLowerCase();
      var t=b.type&&b.type!=='application/octet-stream'?b.type:({heic:'image/heic',heif:'image/heic',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',mp4:'video/mp4',mov:'video/quicktime',pdf:'application/pdf'}[ext]||'application/octet-stream');
      return new File([b],f.name,{type:t});
    });
  })).then(function(files){
    if(navigator.canShare({files:files}))return navigator.share({files:files});
    alert('Perangkat ini tidak bisa membagikan file ini. Pakai tombol Unduh.');
  }).catch(function(){}).then(function(){btn.disabled=false;btn.textContent='Simpan ke Foto / Bagikan';});
};
$('pick').onclick=function(){$('picker').click();};
var q=[],busy=false;
$('picker').onchange=function(e){
  Array.prototype.forEach.call(e.target.files,function(f){
    var r=document.createElement('div');r.className='row';
    var n=document.createElement('div');n.className='n';n.textContent=f.name;
    var s=document.createElement('div');s.className='m';s.textContent='Menunggu...';
    var b=document.createElement('div');b.className='bar';b.innerHTML='<i></i>';
    r.appendChild(n);r.appendChild(s);r.appendChild(b);$('ups').insertBefore(r,$('ups').firstChild);
    q.push({f:f,s:s,b:b.firstChild});
  });
  e.target.value='';run();
};
function run(){
  if(busy||!q.length)return;busy=true;var j=q.shift();
  var x=new XMLHttpRequest();
  x.open('POST','/up?k='+encodeURIComponent(K)+'&name='+encodeURIComponent(j.f.name));
  x.upload.onprogress=function(e){if(e.lengthComputable){var p=Math.round(e.loaded/e.total*100);j.b.style.width=p+'%';j.s.textContent=p+'%';}};
  x.onload=function(){
    if(x.status===200){j.b.style.width='100%';j.s.textContent='Selesai';}
    else{j.s.textContent='Gagal ('+x.status+')';j.s.className='e';}
    busy=false;run();
  };
  x.onerror=function(){j.s.textContent='Gagal terhubung';j.s.className='e';busy=false;run();};
  x.send(j.f);
}
start();
})();
</script>
</body>
</html>
